<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Savings Planner</title>

    <style>
        body {                                                                                                                                                                           give me attarctive code accha lagna chaiyee bohot lagey ga tooo bootstrap bhi use karnaa or attractive banana thoda bohot animation bhi karloooo 
            margin: 0;
            font-family: Poppins, sans-serif;
            background: url("https://images.unsplash.com/photo-1520607162513-77705c0f0d4a")
            no-repeat center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            width: 400px;
            padding: 30px;
            background: rgba(0,0,0,0.65);
            border-radius: 20px;
            color: #fff;
            backdrop-filter: blur(10px);
            animation: fade 1s ease;
        }

        @keyframes fade {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border-radius: 10px;
            border: none;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #ff4f5a;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #ff242f;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>AI Savings Planner</h2>

    <form method="POST">

        <input type="number" name="income" placeholder="Monthly Income" required>
        <input type="number" name="rent" placeholder="Rent" required>
        <input type="number" name="travel" placeholder="Travel Cost" required>
        <input type="number" name="food" placeholder="Food Cost" required>
        <input type="number" name="shopping" placeholder="Shopping Cost" required>

        <button type="submit">Generate Savings Plan</button>
    </form>
</div>

</body>
